# Intégration continue de planrs : mêmes checks que ceux exigés avant tout
# commit (CLAUDE.md), plus les contrôles xtask, la compilation WebAssembly,
# les tests sur macOS et Windows, la MSRV, le budget du moteur et la parité
# sur le corpus public.
#
# Aucun paquet système n'est installé : aucune dépendance actuelle n'en exige à
# la compilation (winit et xkbcommon chargent leurs bibliothèques par dlopen,
# pas de rfd ni d'openssl). À ajouter le jour où une dépendance l'exige (par
# exemple mesa-vulkan-drivers pour lavapipe avec egui_kittest, ADR-0005).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, tests, deny, xtask, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Propriétés du moteur (P13 à P17) à 10 000 cas (critère J2) ; en local,
      # 256 par défaut. Les autres propriétés fixent leur nombre de cas.
      - name: Tests
        run: cargo test --workspace
        env:
          PROPTEST_CASES: "10000"

      # L'action passe `--all-features` par défaut : on le retire pour lancer
      # la même commande qu'en local. Les features sont réglées par
      # `[graph] all-features = true` dans deny.toml.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""

      - name: Couches (règle 9)
        run: cargo xtask layers

      - name: Interdits hors clippy (règle 10)
        run: cargo xtask panics

      - name: planrs-core en WebAssembly
        run: cargo check -p planrs-core --target wasm32-unknown-unknown

      # Version web (et planrs-ui-egui) en WebAssembly : seule la compilation
      # est vérifiée, `trunk build` viendra avec le packaging web.
      - name: planrs-web en WebAssembly
        run: cargo clippy -p planrs-web --target wasm32-unknown-unknown -- -D warnings

  tests-matrix:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux est couvert par le job `checks`.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

  # Budget du moteur (ADR-0009 A18) : médiane de `schedule` sur 5 000 tâches
  # et 10 000 liens, en release ; échec au-delà de 50 ms (cible locale
  # ≤ 10 ms, marge pour les runners). Benchmark criterion ensuite, informatif.
  perf:
    name: budget du moteur (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Budget 50 ms
        run: cargo test -p planrs-tests --release --test perf -- --ignored --nocapture

      - name: Benchmark (informatif)
        run: cargo bench -p planrs-tests --bench schedule -- --warm-up-time 1 --measurement-time 5 --noplot

  # Corpus public (ADR-0004, ADR-0009) : fichiers MSPDI enregistrés par MS
  # Project, téléchargés (sha256 vérifié) et gardés dans un cache privé au
  # dépôt ; recalcul, comparaison et verdict contre les planchers. Seul le
  # rapport (sans nom de tâche) est publié, jamais les fichiers.
  corpus:
    name: corpus public (parité)
    # Pas de PR venue d'un fork : le cache et le téléchargement restent internes au dépôt.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache du corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/files
          key: corpus-${{ hashFiles('tests/corpus/manifest.toml') }}
          restore-keys: corpus-

      - name: Téléchargement (sha256 vérifié)
        run: cargo xtask corpus fetch

      - name: Parité
        run: cargo test -p planrs-tests --test corpus -- --nocapture
        env:
          PLANRS_CORPUS: required

      - name: Rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          # Rapport seul, jamais les fichiers du corpus.
          path: target/tmp/corpus-report.*

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Doit suivre `rust-version` du Cargo.toml racine.
      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets
