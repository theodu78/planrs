# Intégration continue de planrs : mêmes checks que ceux exigés avant tout
# commit (CLAUDE.md), plus les contrôles xtask, la compilation WebAssembly,
# les tests sur macOS et Windows, la MSRV, le budget du moteur, la parité
# sur le corpus public et la conformité au schéma MSPDI.
#
# Aucun paquet système n'est exigé à la compilation (winit, xkbcommon et rfd
# chargent leurs bibliothèques par dlopen, pas d'openssl). Seul le job `ui`
# installe le pilote Vulkan logiciel (mesa-vulkan-drivers, lavapipe) pour les
# captures egui_kittest (ADR-0005, ADR-0011).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, tests, deny, xtask, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Propriétés du moteur (P13 à P17) à 10 000 cas (critère J2) ; en local,
      # 256 par défaut. Les autres propriétés fixent leur nombre de cas.
      - name: Tests
        run: cargo test --workspace
        env:
          PROPTEST_CASES: "10000"

      # L'action passe `--all-features` par défaut : on le retire pour lancer
      # la même commande qu'en local. Les features sont réglées par
      # `[graph] all-features = true` dans deny.toml.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""

      - name: Couches (règle 9)
        run: cargo xtask layers

      - name: Interdits hors clippy (règle 10)
        run: cargo xtask panics

      - name: Chaque règle R-xxx a ses tests (règle 4)
        run: cargo xtask rules

      - name: planrs-core en WebAssembly
        run: cargo check -p planrs-core --target wasm32-unknown-unknown

      # Version web (et planrs-ui-egui) en WebAssembly : seule la compilation
      # est vérifiée, `trunk build` viendra avec le packaging web.
      - name: planrs-web en WebAssembly
        run: cargo clippy -p planrs-web --target wasm32-unknown-unknown -- -D warnings

  # Critère de fin J4 (lot L18, ADR-0012) : « un agent construit un planning
  # de 30 tâches via MCP », sans LLM. Le scénario écrit à la main
  # `tests/mcp/scenarios/build_30.jsonl` est rejoué en mémoire, en HTTP et
  # sur le vrai binaire `planrs mcp` en stdio : résultats égaux aux attendus,
  # journal produit égal au scénario octet pour octet, MSPDI enregistré égal
  # à `tests/mcp/expected/build_30.xml` (par `normalize`), undo complet
  # jusqu'au projet vide, rejeu en mémoire < 2 s en debug. Détail :
  # `docs/features/mcp.md`. Les mêmes tests tournent aussi dans `checks`
  # (`cargo test --workspace`) ; ce job les isole pour le critère.
  # J5 (lot L9) : le scénario `resources_j5.jsonl` (ressources, affectations,
  # types de tâche, surutilisation) passe par les mêmes trois chemins.
  mcp:
    name: MCP (rejeu build_30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rejeu en mémoire et en HTTP
        run: cargo test -p planrs-mcp --features http --test replay --test replay_http

      - name: Rejeu sur le binaire (stdio)
        run: cargo test -p planrs-cli --test mcp_replay

  tests-matrix:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux est couvert par le job `checks`.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

  # Interface egui (ADR-0011, décision 12) : tests egui_kittest avec captures
  # comparées au pixel (tests/snapshots/*.png, seuils dans kittest.toml),
  # rendues par lavapipe (Vulkan logiciel de Mesa) ; le harnais refuse tout
  # adaptateur qui n'est pas un CPU. Les autres jobs exécutent les mêmes tests
  # sans rendu ni comparaison (PLANRS_UI_SNAPSHOTS absent).
  #
  # La CI fait foi : si Mesa du runner rend autrement que le poste local,
  # télécharger l'artefact `ui-snapshots-diff`, vérifier les `*.new.png` à
  # l'œil et les adopter comme références. En local (Linux, mesa-vulkan-drivers) :
  #   PLANRS_UI_SNAPSHOTS=1 UPDATE_SNAPSHOTS=1 WGPU_BACKEND=vulkan \
  #     cargo test -p planrs-ui-egui --test ui
  # réécrit les captures en écart (UPDATE_SNAPSHOTS=force : toutes).
  ui:
    name: interface (captures egui_kittest)
    runs-on: ubuntu-24.04
    env:
      PLANRS_UI_SNAPSHOTS: "1"
      # lavapipe par Vulkan : un seul chemin de rendu, pas de repli GL.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pilote Vulkan logiciel (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libxkbcommon-x11-0

      - name: Adaptateur disponible (diagnostic)
        run: vulkaninfo --summary

      - name: Tests de l'interface (captures comparées)
        run: cargo test -p planrs-ui-egui --test ui

      - name: Captures en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-diff
          path: |
            crates/planrs-ui-egui/tests/snapshots/*.new.png
            crates/planrs-ui-egui/tests/snapshots/*.diff.png
          if-no-files-found: ignore
          retention-days: 14

  # Budget du moteur (ADR-0009 A18) : médiane de `schedule` sur 5 000 tâches
  # et 10 000 liens, en release ; échec au-delà de 50 ms (cible locale
  # ≤ 10 ms, marge pour les runners). Benchmark criterion ensuite, informatif.
  perf:
    name: budget du moteur (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Trois cas (grand réseau, contraint, à rebours, spécification J3
      # § 9.2), mesurés l'un après l'autre : en parallèle, ils se
      # perturberaient.
      - name: Budget 50 ms
        run: cargo test -p planrs-tests --release --test perf -- --ignored --nocapture --test-threads=1

      # Lecture MSPDI : coût linéaire des liens (surcoût < 1 s pour une tâche
      # à 199 999 prédécesseurs) ; médiane de 5 000 tâches, informative.
      - name: Lecture MSPDI
        run: cargo test -p planrs-mspdi --release --test perf -- --ignored --nocapture

      # Fluidité de l'interface (ADR-0011, décision 12) : 5 000 tâches et
      # 10 000 liens dessinés par `planrs_ui_egui::ui` sur un contexte egui
      # nu, médiane < 16 ms et p95 < 32 ms par image (mesuré en local :
      # 0,8 ms de médiane, 0,9 ms de p95).
      - name: Fluidité de l'interface (release)
        run: cargo test -p planrs-ui-egui --release --test perf -- --ignored --nocapture

      - name: Benchmark (informatif)
        run: cargo bench -p planrs-tests --bench schedule -- --warm-up-time 1 --measurement-time 5 --noplot

  # Corpus public (ADR-0004, ADR-0009) : fichiers MSPDI enregistrés par MS
  # Project, téléchargés à chaque exécution (1,3 Mo, adresses figées sur un
  # commit, taille et sha256 vérifiés), jamais mis en cache : aucune copie ne
  # subsiste hors de l'exécution (un cache d'Actions pourrait être restauré
  # par une exécution venue d'un fork, dont le `ci.yml` est celui de la PR).
  # Recalcul, comparaison et verdict contre les planchers. Seul le rapport
  # (sans nom de tâche) est publié, jamais les fichiers.
  corpus:
    name: corpus public (parité)
    # Pas de PR venue d'un fork : confort (un fork n'a rien à y gagner), pas
    # un contrôle de sécurité (une PR de fork exécute son propre `ci.yml`).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Téléchargement (sha256 vérifié)
        run: cargo xtask corpus fetch

      - name: Parité
        run: cargo test -p planrs-tests --test corpus -- --nocapture
        env:
          PLANRS_CORPUS: required

      - name: Rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          # Rapport seul, jamais les fichiers du corpus.
          path: target/tmp/corpus-report.*

  # Schéma MSPDI pj15 (ADR-0010, D18) : fichier public de Microsoft, extrait
  # du MSI du SDK de Project 2013 (64 Mo) par `cargo xtask schema fetch`, en
  # Rust pur, empreintes du MSI et du XSD vérifiées. Le XSD (240 Ko) est mis
  # en cache sous la clé de son empreinte (pas d'enjeu de droits, à la
  # différence du corpus) et revérifié par la même tâche après restauration ;
  # le MSI n'est téléchargé qu'en cas d'absence. Conformité de la table du
  # schéma (P27) et des documents écrits (P26).
  schema:
    name: schéma MSPDI (pj15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache du schéma
        uses: actions/cache@v4
        with:
          path: tests/schema/mspdi_pj15.xsd
          key: mspdi-pj15-1c208a9732d6ba16f677a9f2fb9d5a629f0c200346b1851998a44765c502eb85

      - name: Extraction (sha256 vérifiés)
        run: cargo xtask schema fetch

      - name: Conformité
        run: cargo test -p planrs-tests --test schema
        env:
          PLANRS_SCHEMA: required

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Doit suivre `rust-version` du Cargo.toml racine.
      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets
