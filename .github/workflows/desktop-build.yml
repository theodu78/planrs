# Construction des artefacts de plateforme de planrs (J8, lot L1) :
# - macOS : `planrs.app` universel (x86_64 + arm64) signé ad hoc, avec la
#   CLI dans `cli/planrs`, dans un DMG ;
# - Windows : zip de `planrs-desktop.exe`, `planrs.exe` et `README.txt` ;
# - Linux : archive construite dans un conteneur `debian:bookworm` (glibc
#   2.36 : les binaires tournent sur toute distribution plus récente) ;
# - web : `dist` de trunk.
# Chaque artefact s'appelle `planrs-<version>-<plateforme>.<ext>`, version du
# workspace (job `version`).
#
# Deux usages, une seule définition des builds :
# - préversions : tag `ui-*` poussé, ou lancement manuel (`workflow_dispatch`,
#   visible une fois ce fichier sur la branche par défaut) ; artefacts
#   d'Actions seulement, ni vérification ni publication ;
# - release : appelé par `release.yml` (`workflow_call`), qui vérifie les
#   artefacts (C-REL-02 à C-REL-06) puis les publie.
# Aucun secret ; jeton en lecture seule.
name: Desktop build

on:
  workflow_dispatch: {}
  push:
    tags: ['ui-*']
  workflow_call:
    outputs:
      version:
        description: Version du workspace (noms des artefacts, `--version` attendu)
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version du workspace
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Lire [workspace.package] version
        id: read
        run: |
          version="$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version : $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    name: macOS (DMG universel)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Même plancher que `LSMinimumSystemVersion` de l'Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (x86_64 puis arm64)
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --locked -p planrs -p planrs-cli --target "$target"
          done

      - name: Binaires universels
        run: |
          mkdir -p universal
          for bin in planrs-desktop planrs; do
            lipo -create -output "universal/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin"
            lipo -archs "universal/$bin"
          done

      - name: planrs.app, icône, signature ad hoc, DMG
        run: |
          app=stage/planrs.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" stage/cli
          short="${VERSION%%-*}"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHORT_VERSION@/$short/g" \
            packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp universal/planrs-desktop "$app/Contents/MacOS/planrs-desktop"
          # Icône : jeu iconutil (1x et 2x) tiré de assets/icon (cargo xtask icon).
          mkdir planrs.iconset
          for n in 16 32 128 256 512; do
            cp "assets/icon/planrs-$n.png" "planrs.iconset/icon_${n}x${n}.png"
            cp "assets/icon/planrs-$((n * 2)).png" "planrs.iconset/icon_${n}x${n}@2x.png"
          done
          iconutil -c icns planrs.iconset -o "$app/Contents/Resources/planrs.icns"
          cp universal/planrs stage/cli/planrs
          cp packaging/macos/LISEZ-MOI.txt stage/LISEZ-MOI.txt
          ln -s /Applications stage/Applications
          codesign --force -s - stage/cli/planrs
          codesign --force --deep -s - "$app"
          hdiutil create -volname "planrs $VERSION" -srcfolder stage -format UDZO -ov \
            "planrs-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: planrs-${{ needs.version.outputs.version }}-macos-universal.dmg
          path: planrs-${{ needs.version.outputs.version }}-macos-universal.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (zip x86_64)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p planrs -p planrs-cli --target x86_64-pc-windows-msvc

      - name: Zip
        run: |
          dir="planrs-$VERSION-windows-x86_64"
          mkdir "$dir"
          cp target/x86_64-pc-windows-msvc/release/planrs-desktop.exe \
            target/x86_64-pc-windows-msvc/release/planrs.exe \
            packaging/windows/README.txt "$dir/"
          7z a -tzip "$dir.zip" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: planrs-${{ needs.version.outputs.version }}-windows-x86_64.zip
          path: planrs-${{ needs.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64, debian:bookworm)
    needs: version
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Avant le checkout : git (clone réel) ; gcc et libc6-dev pour l'édition
      # de liens ; aucun autre paquet système n'est exigé à la compilation.
      - name: Outils du conteneur
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev

      - uses: actions/checkout@v7

      - name: rustup (stable, profil minimal)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p planrs -p planrs-cli

      - name: Archive
        run: |
          dir="planrs-$VERSION-linux-x86_64"
          mkdir "$dir"
          cp target/release/planrs-desktop target/release/planrs packaging/linux/planrs.desktop "$dir/"
          cp assets/icon/planrs-256.png "$dir/planrs.png"
          chmod +x "$dir/planrs-desktop" "$dir/planrs"
          tar czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: planrs-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          path: planrs-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-web:
    name: Web (trunk, wasm32)
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: trunk build
        working-directory: apps/planrs-web
        run: trunk build --release --locked

      - name: Archive
        run: |
          dist=apps/planrs-web/dist
          ls -l "$dist"
          {
            echo "Version web de planrs $VERSION : fichiers statiques, à servir en HTTP (pas en file://)."
            echo "Par exemple, depuis le dossier qui contient dist : python3 -m http.server -d dist 8080"
            echo "Puis ouvrir http://localhost:8080 dans un navigateur récent (WebGPU ou WebGL2)."
          } > "$dist/README.txt"
          tar czf "planrs-$VERSION-web.tar.gz" -C apps/planrs-web dist

      - uses: actions/upload-artifact@v4
        with:
          name: planrs-${{ needs.version.outputs.version }}-web.tar.gz
          path: planrs-${{ needs.version.outputs.version }}-web.tar.gz
          if-no-files-found: error
