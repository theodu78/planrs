[workspace]
# Résolveur 3 : tient compte de `rust-version` (MSRV) quand il choisit les
# versions des dépendances.
resolver = "3"
members = [
    "crates/planrs-core",
    "crates/planrs-mspdi",
    "crates/planrs-render",
    "crates/planrs-automation",
    "crates/planrs-mcp",
    "crates/planrs-ui-egui",
    "apps/planrs-cli",
    "apps/planrs",
    "apps/planrs-web",
    "tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# eframe/egui 0.37 exigent Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
# Nom provisoire (voir docs/rename.md).
repository = "https://github.com/theodu78/planrs"

[workspace.dependencies]
# Crates internes (version explicite : pas de dépendance « wildcard » pour cargo-deny).
planrs-core = { path = "crates/planrs-core", version = "0.1.0" }
planrs-mspdi = { path = "crates/planrs-mspdi", version = "0.1.0" }
planrs-render = { path = "crates/planrs-render", version = "0.1.0" }
planrs-automation = { path = "crates/planrs-automation", version = "0.1.0" }
planrs-mcp = { path = "crates/planrs-mcp", version = "0.1.0" }
planrs-ui-egui = { path = "crates/planrs-ui-egui", version = "0.1.0" }

# Dates en heure locale du projet, sans fuseau. On ne demande pas `clock`, mais
# cela ne garantit rien : les features s'unifient sur le workspace et rmcp
# active `chrono/now` (et `clock` en wasm). L'interdiction de lire l'heure dans
# planrs-core (règle 5) est imposée par `crates/planrs-core/clippy.toml`.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
quick-xml = { version = "0.42.0", features = ["serialize"] }
# rmcp épinglé exactement (ADR-0005 : API mouvante) ; toute montée est un commit dédié.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
# J4 (ADR-0012) : schémas JSON des commandes (planrs-automation), déjà tirés
# par rmcp `server` à la même version ; le cœur n'en dépend pas.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
# Serveur MCP stdio (planrs-mcp) : runtime à fil unique, entrées/sorties
# standard. Déjà au lock (tiré par rmcp).
tokio = { version = "1.53.3", default-features = false, features = ["rt", "io-std", "io-util", "macros", "sync"] }
# Jeton du rendez-vous du canal de contrôle (ADR-0002), hors wasm. Déjà au lock.
getrandom = "0.3.4"
egui = "0.37.0"
eframe = "0.37.0"
# Interface (planrs-ui-egui et applications seulement, ADR-0011). rfd sans
# `gtk3` ni `wayland` : son portail XDG charge libdbus par dlopen (aucun paquet
# système à la compilation) et attend ses futurs avec pollster (tiré par
# `xdg-portal`). fluent pour les traductions (fichiers `.ftl` embarqués),
# sys-locale pour la langue du système, js-sys pour « maintenant » sur le web.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Attente du sélecteur rfd asynchrone dans un fil dédié sur le desktop
# (ADR-0011 : le dialogue synchrone fait avorter winit sur macOS). Déjà tiré
# par eframe ; aucune crate nouvelle.
pollster = "1.0.1"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
sys-locale = "0.3.2"
js-sys = "0.3"
# Développement de l'interface : test de complétude des `.ftl` et harnais
# egui_kittest (captures par wgpu, rendu logiciel en CI).
fluent-syntax = "0.12"
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
cargo_metadata = "0.23.1"
# `cargo xtask panics` : analyse syntaxique des sources, lignes des jetons.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
toml = "1.1.8"
# Empreintes SHA-256 du corpus public (`cargo xtask corpus fetch` et harnais
# `tests/corpus`) : aucun téléchargement dans `cargo test`.
sha2 = "0.11.1"
# `cargo xtask schema fetch` (ADR-0010, D18) : lecture du MSI du SDK de
# Project 2013 et de son archive CAB, en Rust pur (MIT).
msi = "0.10.0"
cab = "0.6.0"
# CSV des tâches (ADR-0010, D17) dans planrs-automation : lecture RFC 4180
# (Unlicense OR MIT) et décodage UTF-16 / Windows-1252 ((Apache-2.0 OR MIT)
# AND BSD-3-Clause), plutôt que des décodeurs faits main.
csv = "1.4.0"
encoding_rs = "0.8.42"
# Dépendances de développement de planrs-core (ADR-0008) : JSON de référence et
# aller-retour serde, tests de propriétés. proptest sans `fork` ni `timeout`
# (inutiles ici, et autant de crates en moins).
serde_json = "1.0.154"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Benchmarks informatifs : conversions de calendrier (ADR-0008, non exécuté
# en CI, seulement compilé par clippy --all-targets) et moteur (ADR-0009,
# `tests/benches/schedule.rs`, exécuté par le job CI `perf`). Sans rayon ni
# plotters : ni parallélisme ni graphiques, autant de crates en moins.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Validation XSD des documents écrits (P26, ADR-0010 D17) : dépendance de
# développement de planrs-tests, Rust pur, BSD-2-Clause.
uppsala = "0.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Règle 10 « ne jamais planter » : interdits hors tests.
# Les tests les lèvent par des `#![allow(...)]` locaux et commentés.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
# Tout `#[allow]` donne sa raison (`reason = "..."`). `cargo xtask panics`
# refuse en plus qu'un interdit ci-dessus soit levé hors du code de test.
allow_attributes_without_reason = "deny"
# Limites connues (ADR-0006) : aucune lint ne couvre l'indexation d'une map
# (`map[&key]`) ; `assert!` et sa famille sont refusés par `cargo xtask panics`.
# `float_arithmetic` n'est interdit que dans planrs-core (attribut de crate) :
# le rendu SVG et l'interface egui calculent nativement en f32/f64.

# Propriétés du moteur (P13 à P17) : 10 000 cas en CI. En debug pur, le
# fichier `schedule_properties` dépasse 60 s (90 s mesurées pour 10 000 cas
# sur 4 cœurs) ; une optimisation légère de planrs-core et de ses tests le
# ramène sous ce seuil sans toucher aux assertions de débordement.
[profile.test.package.planrs-core]
opt-level = 1
