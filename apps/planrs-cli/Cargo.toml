[package]
name = "planrs-cli"
description = "Ligne de commande de planrs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Le binaire s'appelle `planrs` (voir docs/rename.md).
[[bin]]
name = "planrs"
path = "src/main.rs"

[dependencies]
# `clock` : « maintenant » est lu ici seulement (`now.rs`), puis injecté.
chrono = { workspace = true, features = ["clock"] }
planrs-core.workspace = true
planrs-automation.workspace = true
# `http` : `planrs mcp --http` (lot L17).
planrs-mcp = { workspace = true, features = ["http"] }
planrs-mspdi.workspace = true
planrs-render.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Rejeu `build_30` sur le vrai binaire en stdio (lot L18, vérification 4) :
# client rmcp sur les tubes d'un processus fils (`tokio::process`).
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["process", "rt", "macros", "time"] }

[lints]
workspace = true
