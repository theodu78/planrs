# Configuration trunk de la version web (`trunk serve` / `trunk build --release`
# depuis ce dossier). Exécuté par le workflow `desktop-build.yml` (job `web`).

[build]
target = "index.html"
dist = "dist"
# Adresses relatives : `dist/` peut être servi sous un sous-chemin (pages
# statiques, artefact décompressé n'importe où).
public_url = "./"
# Noms de fichiers suffixés par leur empreinte (cache navigateur sûr).
filehash = true
# Profil cargo du web (J8, lot L13) : `[profile.wasm-release]` du
# Cargo.toml racine (LTO complet, une unité de code, optimisé en taille ;
# budget C-REL-05 : .wasm gzip -9 ≤ 3 Mio). S'applique aussi à
# `trunk serve` : construction plus lente, mais même binaire qu'en release.
cargo_profile = "wasm-release"
