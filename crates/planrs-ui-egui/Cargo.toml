[package]
name = "planrs-ui-egui"
description = "Interface egui de planrs (table, Gantt, vues)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
planrs-core.workspace = true
planrs-mspdi.workspace = true
# Session et registre de commandes (ADR-0012 D11) : toute édition passe par
# `Action::Exec(Batch)`.
planrs-automation.workspace = true
# Style du planning et contraste WCAG partagés (ADR-0016 D5, D6).
planrs-render.workspace = true
egui.workspace = true
eframe.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
rfd.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Attente du sélecteur asynchrone dans un fil dédié (`io.rs`).
pollster.workspace = true
# Capture relayée (`relay.rs`, C-CTL-08) : PNG puis base64.
image.workspace = true
base64.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Langue du navigateur (`navigator.language`).
sys-locale = { workspace = true, features = ["js"] }
# Sélecteur de fichiers asynchrone (rfd) lancé sur l'exécuteur du navigateur ;
# `file-handle-inner` donne le `File` du navigateur, lu par `Blob::arrayBuffer`
# (échec signalé, contrairement à `FileHandle::read`).
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# Enregistrement web : téléchargement direct (Blob, URL d'objet, ancre
# `download`) au lieu de la fenêtre de rfd (relecture finale J4, F3).
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement"] }

[dev-dependencies]
egui_kittest.workspace = true
# Sonde des polices de repli du desktop (`tests/ui/desktop.rs`).
egui_system_font_provider.workspace = true
# Réseau généré ouvert sans MSPDI (N8 : `App::open_project`), exemple
# `snapshot --generate N` et test de fluidité.
planrs-tests = { path = "../../tests", version = "0.1.0" }
fluent-syntax.workspace = true
proptest.workspace = true

[lints]
workspace = true
