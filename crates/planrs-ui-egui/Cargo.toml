[package]
name = "planrs-ui-egui"
description = "Interface egui de planrs (table, Gantt, vues)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
planrs-core.workspace = true
planrs-mspdi.workspace = true
# Session et registre de commandes (ADR-0012 D11) : toute édition passe par
# `Action::Exec(Batch)`.
planrs-automation.workspace = true
egui.workspace = true
eframe.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
rfd.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Attente du sélecteur asynchrone dans un fil dédié (`io.rs`).
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Langue du navigateur (`navigator.language`).
sys-locale = { workspace = true, features = ["js"] }
# Sélecteur de fichiers asynchrone (rfd) lancé sur l'exécuteur du navigateur ;
# `file-handle-inner` donne le `File` du navigateur, lu par `Blob::arrayBuffer`
# (échec signalé, contrairement à `FileHandle::read`).
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
fluent-syntax.workspace = true

[lints]
workspace = true
