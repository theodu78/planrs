# Configuration clippy propre à planrs-ui-egui.
#
# Clippy lit le `clippy.toml` le plus proche du manifeste de la crate et ne
# fusionne pas les fichiers (ADR-0006) : ce fichier est autonome.
#
# « Maintenant » est injecté par l'application (`Env::now`) : aucune horloge
# dans l'interface (règle 5, déterminisme des tests et des captures). En
# wasm32-unknown-unknown, `Instant::now`, `SystemTime::now` et
# `std::thread::spawn` paniquent : ces listes servent aussi de garde web.
# `allow-invalid` sur les horloges chrono : sans la feature `clock` (build
# wasm32), chrono n'a pas de `now` et clippy signalerait un chemin introuvable.

disallowed-methods = [
    { path = "chrono::Utc::now", reason = "règle 5 : « maintenant » est injecté par Env::now", allow-invalid = true },
    { path = "chrono::Local::now", reason = "règle 5 : « maintenant » est injecté par Env::now", allow-invalid = true },
    { path = "std::time::SystemTime::now", reason = "règle 5 : aucune horloge dans l'interface (et panique en wasm32)" },
    { path = "std::time::Instant::now", reason = "règle 5 : aucune horloge dans l'interface (et panique en wasm32)" },
    { path = "std::thread::spawn", reason = "panique en wasm32 ; ouverture synchrone sur le fil d'interface (natif) ou spawn_local (web)" },
]

disallowed-types = [
    { path = "std::time::Instant", reason = "règle 5 : aucune horloge dans l'interface (et panique en wasm32)" },
    { path = "std::time::SystemTime", reason = "règle 5 : aucune horloge dans l'interface (et panique en wasm32)" },
]
