[package]
name = "planrs-tests"
description = "Harnais de tests transverses de planrs : règles R-xxx, fixtures, oracle MS Project, corpus public."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Arborescence imposée par le brief (tests/rules, tests/oracle, tests/corpus) :
# les cibles sont déclarées à la main, pas découvertes.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "lib.rs"

[[test]]
name = "rules"
path = "rules/main.rs"

[[test]]
name = "oracle"
path = "oracle/main.rs"

[[test]]
name = "corpus"
path = "corpus/main.rs"

# Budget de performance du moteur (ignoré hors du job CI `perf`, en release).
[[test]]
name = "perf"
path = "perf/main.rs"

# Benchmark informatif du moteur (criterion), exécuté par le job CI `perf`.
[[bench]]
name = "schedule"
path = "benches/schedule.rs"
harness = false

[dependencies]
chrono.workspace = true
planrs-core.workspace = true
planrs-mspdi.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true
