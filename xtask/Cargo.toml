[package]
name = "xtask"
description = "Tâches de maintenance du dépôt planrs (motif cargo-xtask)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cab.workspace = true
cargo_metadata.workspace = true
# `cargo xtask icon` : icône de l'application en PNG (format PNG seul, déjà
# au lock, tiré par l'interface).
image.workspace = true
msi.workspace = true
proc-macro2.workspace = true
serde.workspace = true
sha2.workspace = true
syn.workspace = true
toml.workspace = true
# `cargo xtask fonts` : avances d'Inter ; version tirée par egui (déjà au
# lock), distincte de la 0.42 de krilla.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# `cargo xtask icons` (ADR-0017 D6) : lecture des SVG Lucide et
# aplatissement des courbes en polylignes. Versions déjà au lock (tirées par
# l'écosystème egui) ; aucune crate nouvelle, xtask seulement.
roxmltree = "0.21.1"
kurbo = "0.13.1"

[lints]
workspace = true
